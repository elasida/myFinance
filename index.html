<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance</title>

    style.css
</head>

<body>

    <div class="header">
        <h1>💰 MyFinance</h1>
        <p id="monthLabel"></p>
    </div>

    <div class="hero">

        <div class="hero-label">
            Available Balance
        </div>

        <div class="hero-balance" id="heroBalance">
            Rp 0
        </div>

        <div class="hero-row">

            <div class="hero-box">
                <small>Total Income</small>
                <strong id="heroIncome">Rp 0</strong>
            </div>

            <div class="hero-box">
                <small>Total Outcome</small>
                <strong id="heroOutcome">Rp 0</strong>
            </div>

        </div>

    </div>

    <div class="summary">

        <div class="summary-card">
            <h5>INCOME</h5>
            <p id="totalIncome">Rp 0</p>
        </div>

        <div class="summary-card">
            <h5>OUTCOME</h5>
            <p id="totalOutcome">Rp 0</p>
        </div>

        <div class="summary-card">
            <h5>BALANCE</h5>
            <p id="balance">Rp 0</p>
        </div>

    </div>

    <div class="card">

        <h2>💵 Income Bulanan</h2>

        <div class="input-group">
            <label>Gaji</label>
            <input type="number" id="salary" value="0">
        </div>

        <div class="input-group">
            <label>Bonus</label>
            <input type="number" id="bonus" value="0">
        </div>

        <div class="input-group">
            <label>Tunjangan</label>
            <input type="number" id="allowance" value="0">
        </div>

        <div class="input-group">
            <label>Lembur (Auto)</label>
            <input type="number" id="overtime" value="0" readonly>
        </div>

        <div class="input-group">
            <label>Travel Normal (Auto)</label>
            <input type="number" id="travelNormal" value="0" readonly>
        </div>

        <div class="input-group">
            <label>Travel Weekend (Auto)</label>
            <input type="number" id="travelWeekend" value="0" readonly>
        </div>

        <div class="input-group">
            <label>Field Allowance (Auto)</label>
            <input type="number" id="fieldAllowance" value="0" readonly>
        </div>

    </div>

    <div class="card">

        <h2>📤 Outcome Bulanan</h2>

        <div class="input-group">
            <input type="text"
                   id="expenseName"
                   placeholder="Nama Pengeluaran">
        </div>

        <div class="input-group">
            <input type="number"
                   id="expenseAmount"
                   placeholder="Nominal">
        </div>

        <button class="btn"
                onclick="addExpense()">
            + Tambah Pengeluaran
        </button>

        <div id="expenseList"></div>

    </div>

    <div class="bottom-nav">

        <div class="nav-item">🏠<br>Dashboard</div>
        <div class="nav-item">⏰<br>Lembur</div>
        <div class="nav-item">🏢<br>Expense</div>
        <div class="nav-item">📊<br>Report</div>
        <div class="nav-item">⚙️<br>Setting</div>

    </div>

    app.jsscript>

</body>

</html>
